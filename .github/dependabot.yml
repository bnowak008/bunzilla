version: 2
updates:
  # Main package dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      development-dependencies:
        patterns:
          - "@biomejs/*"
          - "@types/*"
          - "typescript"
          - "vitest"
          - "bun-types"
        update-types:
          - "minor"
          - "patch"

  # Template: utility
  - package-ecosystem: "npm"
    directory: "/src/templates/utility"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Template: webapp (base)
  - package-ecosystem: "npm"
    directory: "/src/templates/webapp"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

